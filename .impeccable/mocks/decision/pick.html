<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1440"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;background:#fff;color:#12224A;font-family:Helvetica,Arial,sans-serif;position:relative;overflow:hidden}
.frame{position:absolute;inset:36px;border:3px solid #12224A}
.zt{position:absolute;top:8px;left:36px;right:36px;display:flex;justify-content:space-around;font-size:16px;color:#6a74a0}
.zl{position:absolute;left:10px;top:36px;bottom:36px;display:flex;flex-direction:column;justify-content:space-around;font-size:16px;color:#6a74a0}
h1{position:absolute;left:90px;top:90px;width:700px;font-size:104px;line-height:.95;letter-spacing:-3px;font-weight:800}
.sub{position:absolute;left:90px;top:410px;width:520px;font-size:24px;line-height:1.4}
.shot{position:absolute;left:660px;top:90px;width:690px;height:430px;border:2px solid #12224A;background:repeating-linear-gradient(0deg,#eef0f8 0 28px,#fff 28px 56px)}
.shot:after{content:"DRAWING 01 · SEARCH ACROSS REPOS";position:absolute;left:12px;bottom:-30px;font-size:15px;letter-spacing:2px;color:#6a74a0}
.rev{position:absolute;left:640px;top:70px;width:90px;height:90px;border:3px solid #7B2FF7;border-radius:50%}
.tb{position:absolute;right:90px;bottom:90px;width:720px;border:3px solid #12224A;display:grid;grid-template-columns:1fr 1fr 1fr;font-size:16px}
.tb div{border:1px solid #12224A;padding:12px 14px}.tb b{display:block;font-size:12px;letter-spacing:2px;color:#6a74a0;margin-bottom:6px}.tb .w{grid-column:span 2;font-size:30px;font-weight:800}
.tb .go{background:#12224A;color:#fff;font-weight:700;font-size:22px;display:flex;align-items:center}
.mark{position:absolute;left:90px;bottom:100px;font-weight:800;font-size:28px}
</style></head><body><div class="zt"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div><div class="zl"><span>A</span><span>B</span><span>C</span><span>D</span></div>

</body></html>
